[package]
name = "rust-ios-backup"
version = "0.0.0"
description = "iOS backup backend and Tauri commands for Oh My WeChat"
edition = "2021"
publish = false

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-kw = "0.2"
cbc = { version = "0.1", features = ["zeroize"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1"
plist = "1"
prost = { version = "0.14", default-features = false, features = [
	"std",
	"derive",
] }
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
md5 = "0.8"
icu_casemap = "2.3"
icu_locale_core = { version = "2.3", features = ["serde"] }
icu_normalizer = { version = "2.3", default-features = false, features = [
	"compiled_data",
] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
tauri-plugin-dialog = "2"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tempfile = "3"
